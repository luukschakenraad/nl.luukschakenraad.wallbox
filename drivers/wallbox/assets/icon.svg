<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- Wall charger seen from the right: front with light ring, side depth, cable -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" transform="translate(40 0)">
    <!-- side and back, only the part visible behind the front -->
    <path d="M195 187.4 L295 153.4 A140 140 0 0 1 340 146 L560 146 A140 140 0 0 1 700 286 L700 506 A140 140 0 0 1 605 638.6 L505 672.6" stroke-width="40"/>
    <!-- front -->
    <rect x="100" y="180" width="500" height="500" rx="140" stroke-width="40"/>
    <!-- light ring -->
    <rect x="175" y="255" width="350" height="350" rx="95" stroke-width="20"/>
    <!-- cable from the bottom -->
    <path d="M350 680 C350 800 420 860 540 880 C620 893 680 910 720 940" stroke-width="40"/>
  </g>
</svg>
